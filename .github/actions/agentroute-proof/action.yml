name: AgentRoute proof verification
description: Verify an AgentRoute proof pack and optionally require a trusted detached signature.
inputs:
  proof-pack:
    description: Proof-pack directory relative to the caller workspace, or an absolute path
    required: true
  attestation:
    description: Optional detached .arsig file relative to the caller workspace, or an absolute path
    required: false
    default: ""
  public-key:
    description: Optional trusted Ed25519 public key relative to the caller workspace, or an absolute path
    required: false
    default: ""
  require-trusted-signature:
    description: Require an attestation that verifies against the supplied public key
    required: false
    default: "false"
outputs:
  root-sha256:
    description: Verified proof-manifest root SHA-256
    value: ${{ steps.verify.outputs['root-sha256'] }}
  artifact-count:
    description: Number of manifest-bound proof artifacts
    value: ${{ steps.verify.outputs['artifact-count'] }}
  signature-valid:
    description: Whether a detached signature was cryptographically valid
    value: ${{ steps.verify.outputs['signature-valid'] }}
  signature-trusted:
    description: Whether the signature matched the caller-pinned public key
    value: ${{ steps.verify.outputs['signature-trusted'] }}
runs:
  using: composite
  steps:
    - name: Build the pinned AgentRoute revision
      shell: bash
      working-directory: ${{ github.action_path }}/../../..
      run: |
        set -euo pipefail
        npm ci --ignore-scripts
        npm run build
    - name: Verify AgentRoute proof evidence
      id: verify
      shell: bash
      env:
        AGENTROUTE_PROOF_PACK: ${{ inputs.proof-pack }}
        AGENTROUTE_ATTESTATION: ${{ inputs.attestation }}
        AGENTROUTE_PUBLIC_KEY: ${{ inputs.public-key }}
        AGENTROUTE_REQUIRE_TRUSTED_SIGNATURE: ${{ inputs.require-trusted-signature }}
      run: node "$GITHUB_ACTION_PATH/verify.mjs"
